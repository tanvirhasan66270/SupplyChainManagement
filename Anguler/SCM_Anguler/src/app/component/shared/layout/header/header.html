<header class="header" *ngIf="activeRole !== 'CUSTOMER'">
  <!-- Left spacer -->
  <div class="header-left"></div>

  <!-- Right actions -->
  <div class="header-actions">
    <!-- Time -->
    <div class="header-time">
      <i class="bi bi-clock"></i>
      <span>{{ currentDateTime }}</span>
    </div>

    <!-- Notifications -->
    <button class="header-icon-btn" routerLink="/notifications" title="Notifications">
      <i class="bi bi-bell"></i>
      <span *ngIf="unreadNotificationCount > 0" class="notification-badge">{{
        unreadNotificationCount
      }}</span>
    </button>

    <!-- Messages -->
    <button class="header-icon-btn" routerLink="/messages" title="Messages">
      <i class="bi bi-chat-dots"></i>
    </button>

    <!-- Profile Dropdown -->
    <div class="profile-container">
      <button class="profile-trigger" (click)="toggleDropdown()">
        <div class="avatar">
          <span>{{ getInitials() }}</span>
          <span class="avatar-status" [class.online]="onlineStatus"></span>
        </div>
        <div class="profile-meta">
          <span class="profile-name">{{ user?.name || 'SCM User' }}</span>
          <span class="profile-role">{{ user?.role || 'User' }}</span>
        </div>
        <i class="bi bi-chevron-down profile-chevron" [class.open]="showDropdown"></i>
      </button>

      <!-- Dropdown -->
      <div *ngIf="showDropdown" class="dropdown-backdrop" (click)="toggleDropdown()"></div>
      <div *ngIf="showDropdown" class="profile-dropdown">
        <div class="dropdown-header">
          <div class="avatar avatar-md">
            <span>{{ getInitials() }}</span>
          </div>
          <div>
            <div class="dropdown-name">{{ user?.name || 'SCM User' }}</div>
            <div class="dropdown-role">{{ user?.role }}</div>
          </div>
        </div>

        <div class="dropdown-divider"></div>

        <div class="dropdown-menu">
          <button class="dropdown-item" (click)="handleDropdownAction('View Profile')">
            <i class="bi bi-person"></i> View Profile
          </button>
          <button class="dropdown-item" (click)="handleDropdownAction('Edit Profile')">
            <i class="bi bi-pencil"></i> Edit Profile
          </button>
          <button class="dropdown-item" (click)="handleDropdownAction('reset-password')">
            <i class="bi bi-lock"></i> Change Password
          </button>
          <button class="dropdown-item" (click)="toggleTheme()">
            <i class="bi bi-palette"></i> Theme Toggle
          </button>
          <button class="dropdown-item" (click)="toggleOnlineStatus()">
            <i class="bi" [ngClass]="onlineStatus ? 'bi-toggle-on' : 'bi-toggle-off'"></i>
            {{ onlineStatus ? 'Online' : 'Offline' }}
          </button>
        </div>

        <div class="dropdown-divider"></div>

        <div class="dropdown-menu">
          <button
            class="dropdown-item dropdown-item-danger"
            (click)="handleDropdownAction('logout')"
          >
            <i class="bi bi-box-arrow-right"></i> Sign Out
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<header class="header customer-header border-0 shadow-sm px-4 py-3 bg-white d-flex justify-content-between align-items-center" *ngIf="activeRole === 'CUSTOMER'" style="height: 70px; border-bottom: 1px solid #f1f5f9 !important;">
  <!-- Left Side: Enterprise Logo / Brand -->
  <div class="header-left-brand d-flex align-items-center gap-2 d-lg-none">
    <div class="bg-primary text-white rounded-3 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; background-color: #2563eb !important;">
      <i class="bi bi-box-seam-fill fs-6"></i>
    </div>
    <span class="fw-bold text-dark font-sans" style="font-size: 0.9rem;">SCM PRO</span>
  </div>
  <div class="d-none d-lg-block"></div>

  <!-- Right Side: Actions -->
  <div class="header-actions d-flex align-items-center gap-3">
    <!-- Date & Time Capsule -->
    <div class="header-time-capsule px-3 py-1.5 rounded-pill bg-light d-flex align-items-center gap-2 text-secondary font-monospace" style="font-size: 0.75rem; border: 1px solid #f1f5f9;">
      <i class="bi bi-clock-fill text-primary" style="color: #2563eb !important;"></i>
      <span>{{ currentDateTime }}</span>
    </div>

    <!-- Alert Notifications -->
    <button class="btn btn-icon btn-light position-relative rounded-circle d-flex align-items-center justify-content-center" style="width: 38px; height: 38px; background-color: #f8fafc;" routerLink="/notifications" title="Notifications">
      <i class="bi bi-bell-fill text-secondary fs-6"></i>
      <span *ngIf="unreadNotificationCount > 0" class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-danger p-1" style="width: 8px; height: 8px;"></span>
    </button>

    <!-- Message Alerts -->
    <button class="btn btn-icon btn-light position-relative rounded-circle d-flex align-items-center justify-content-center" style="width: 38px; height: 38px; background-color: #f8fafc;" routerLink="/messages" title="Messages">
      <i class="bi bi-chat-dots-fill text-secondary fs-6"></i>
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-danger p-1" style="width: 8px; height: 8px;"></span>
    </button>

    <!-- Divider -->
    <div class="vr bg-secondary bg-opacity-20 d-none d-sm-block" style="height: 24px; width: 1px;"></div>

    <!-- Profile Dropdown Trigger -->
    <div class="profile-container position-relative">
      <button class="btn btn-light d-flex align-items-center gap-2 p-1.5 rounded-pill border-0" style="background-color: #f8fafc;" (click)="toggleDropdown()">
        <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold fs-7" style="width: 32px; height: 32px; background-color: #2563eb !important;">
          <span>{{ getInitials() }}</span>
        </div>
        <div class="profile-meta text-start d-none d-sm-block pe-2" style="line-height: 1.1;">
          <div class="profile-name fw-bold text-dark text-truncate" style="font-size: 0.8rem; max-width: 90px;">{{ user?.name || 'Customer' }}</div>
          <span class="profile-role text-muted fw-semibold text-uppercase" style="font-size: 0.58rem; letter-spacing: 0.05em;">{{ user?.role || 'CUSTOMER' }}</span>
        </div>
        <i class="bi bi-chevron-down text-muted fs-8 pe-1 d-none d-sm-inline-block"></i>
      </button>

      <!-- Dropdown Panel -->
      <div *ngIf="showDropdown" class="dropdown-backdrop position-fixed top-0 start-0 w-100 h-100" style="z-index: 999; background: transparent;" (click)="toggleDropdown()"></div>
      <div *ngIf="showDropdown" class="profile-dropdown position-absolute end-0 mt-2 bg-white rounded-4 shadow-lg border-0 p-2 animate-fade-in" style="z-index: 1000; width: 240px; border: 1px solid #f1f5f9 !important;">
        <div class="dropdown-header d-flex align-items-center gap-2.5 p-2.5">
          <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 38px; height: 38px; background-color: #2563eb !important;">
            <span>{{ getInitials() }}</span>
          </div>
          <div class="text-start" style="line-height: 1.2;">
            <div class="dropdown-name fw-bold text-dark fs-7">{{ user?.name || 'Customer' }}</div>
            <div class="dropdown-role text-muted font-monospace" style="font-size: 0.65rem;">{{ user?.email }}</div>
          </div>
        </div>

        <div class="dropdown-divider my-1.5" style="border-top: 1px solid #f1f5f9;"></div>

        <div class="dropdown-menu border-0 shadow-none p-0 d-block">
          <button class="dropdown-item d-flex align-items-center gap-2 px-3 py-2 rounded-3 text-secondary fs-7.5" routerLink="/dashboard" (click)="toggleDropdown()">
            <i class="bi bi-person-fill text-muted"></i> View Profile
          </button>
          <button class="dropdown-item d-flex align-items-center gap-2 px-3 py-2 rounded-3 text-secondary fs-7.5" routerLink="/dashboard" (click)="toggleDropdown()">
            <i class="bi bi-gear-fill text-muted"></i> Settings
          </button>
          <button class="dropdown-item d-flex align-items-center gap-2 px-3 py-2 rounded-3 text-secondary fs-7.5" (click)="toggleTheme()">
            <i class="bi bi-palette-fill text-muted"></i> Toggle Theme
          </button>
        </div>

        <div class="dropdown-divider my-1.5" style="border-top: 1px solid #f1f5f9;"></div>

        <div class="dropdown-menu border-0 shadow-none p-0 d-block">
          <button class="dropdown-item dropdown-item-danger d-flex align-items-center gap-2 px-3 py-2 rounded-3 text-danger fs-7.5" (click)="handleDropdownAction('logout')">
            <i class="bi bi-box-arrow-right"></i> Sign Out
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Logout Modal -->
<div *ngIf="showLogoutModal" class="modal-backdrop" (click)="closeLogoutModal()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-icon">
      <i class="bi bi-box-arrow-right"></i>
    </div>
    <h3>Sign Out</h3>
    <p>Are you sure you want to end your session?</p>
    <div class="modal-actions">
      <button class="scm-btn scm-btn-secondary" (click)="closeLogoutModal()">Cancel</button>
      <button class="scm-btn scm-btn-danger" (click)="confirmLogout()">Sign Out</button>
    </div>
  </div>
</div>
